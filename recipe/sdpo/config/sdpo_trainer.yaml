# SDPO trainer config (overlay).
#
# Composes the clean verl `ppo_trainer` defaults, then overrides the actor target
# to the SDPO config subclass and injects the `self_distillation` block. This file
# is self-contained (it does NOT use the source repo's `user.yaml`); all paths and
# the few env-dependent knobs are supplied by the run scripts via Hydra overrides.
#
# Length budget (matches the source SDPO config):
#   MAX_PROMPT_LENGTH=2048, MAX_RESPONSE_LENGTH=20480
#   MAX_MODEL_LEN=18944 (= rollout / ppo_max_token_len_per_gpu)
#   self_distillation.max_reprompt_len=22528 (teacher prompt, handled in FSDP actor)

hydra:
  searchpath:
    - file://verl/verl/trainer/config

defaults:
  - ppo_trainer
  - _self_

data:
  train_batch_size: 32
  gen_batch_size: ${data.train_batch_size}
  max_prompt_length: 2048
  max_response_length: 20480
  filter_overlong_prompts: True
  shuffle: True
  trust_remote_code: True
  apply_chat_template_kwargs: { "enable_thinking": true }

actor_rollout_ref:
  actor:
    # Overlay: build the SDPO config subclass (adds `self_distillation`) instead of
    # the upstream verl.workers.config.FSDPActorConfig.
    _target_: recipe.sdpo.sdpo_config.SDPOFSDPActorConfig

    ppo_mini_batch_size: 32
    ppo_micro_batch_size_per_gpu: 1
    ppo_max_token_len_per_gpu: 18944
    clip_ratio_high: 0.28
    clip_ratio_low: 0.2
    use_kl_loss: False

    policy_loss:
      # vanilla -> GRPO baseline; sdpo -> self-distillation
      loss_mode: sdpo

    self_distillation:
      _target_: recipe.sdpo.sdpo_config.SDPOSelfDistillationConfig
      full_logit_distillation: True
      alpha: 0.5
      success_reward_threshold: 0.5
      teacher_regularization: ema
      teacher_update_rate: 0.0
      distillation_topk: 100
      distillation_add_tail: True
      max_reprompt_len: 22528
      reprompt_truncation: right
      dont_reprompt_on_self_success: True
      remove_thinking_from_demonstration: False
      is_clip: 2.0
      include_environment_feedback: False
      environment_feedback_only_without_solution: False
      solution_source: group_only
      reprompt_template: |-
        {prompt}{solution}{feedback}

        Correctly solve the original question.
      solution_template: |-

        Correct solution:

        {successful_previous_attempt}

      feedback_template: |-

        The following is feedback from your unsuccessful earlier attempt:

        {feedback_raw}

    optim:
      lr: 1e-5
      lr_warmup_steps: 10

  ref:
    log_prob_micro_batch_size_per_gpu: 1

  model:
    trust_remote_code: True

  rollout:
    name: vllm
    n: 8
    calculate_log_probs: True
    gpu_memory_utilization: 0.55
    log_prob_micro_batch_size_per_gpu: 1
    tensor_model_parallel_size: 1
    max_num_batched_tokens: 18944
    max_model_len: 18944
    temperature: 1.0
    top_p: 1
    top_k: -1
    val_kwargs:
      top_p: 0.95
      temperature: 0.6
      n: 1
      do_sample: True

algorithm:
  # disables critic
  adv_estimator: grpo
  norm_adv_by_std_in_grpo: False
  use_kl_in_reward: False
  rollout_correction:
    rollout_is: token
    rollout_is_threshold: 2.0

custom_reward_function:
  path: core/utils/reward_score/sdpo_math_feedback_score.py
  name: compute_score

reward_model:
  reward_manager: dapo
  use_reward_loop: False
  overlong_buffer:
    enable: False
    len: 0
    penalty_factor: 0.0
    log: False
  api_endpoints:
    - name: "empty"
      endpoint: "xxxx"

trainer:
  project_name: verl-sdpo
  n_gpus_per_node: 8
  nnodes: 1
  save_freq: 10
  test_freq: 10
  max_actor_ckpt_to_keep: null
  total_epochs: 500
  total_training_steps: null
  val_before_train: False
  logger: ["console", "wandb"]
