# Canonical RLSD trainer config on the current stable_rl/verl stack.
# Runtime paths, batch sizes and experiment identity are supplied by run_math_rlsd.sh.

hydra:
  searchpath:
    - file://verl/verl/trainer/config

defaults:
  - ppo_trainer
  - _self_

data:
  train_batch_size: 32
  gen_batch_size: ${data.train_batch_size}
  max_prompt_length: 2048
  max_response_length: 20480
  filter_overlong_prompts: True
  shuffle: True
  trust_remote_code: True
  apply_chat_template_kwargs: { "enable_thinking": true }

actor_rollout_ref:
  actor:
    # Overlay: build the SDPO config subclass (adds `self_distillation`) instead of
    # the upstream verl.workers.config.FSDPActorConfig.
    _target_: recipe.rlsd.rlsd_config.RLSDFSDPActorConfig

    ppo_mini_batch_size: 32
    ppo_micro_batch_size_per_gpu: 1
    ppo_max_token_len_per_gpu: 18944
    clip_ratio_high: 0.28
    clip_ratio_low: 0.2
    use_kl_loss: False

    policy_loss:
      # rlsd -> teacher-conditioned token reweighting of GRPO advantages.
      loss_mode: rlsd

    self_distillation:
      _target_: recipe.sdpo.sdpo_config.SDPOSelfDistillationConfig
      full_logit_distillation: True
      alpha: 0.5
      success_reward_threshold: 0.5
      teacher_regularization: ema
      teacher_update_rate: 0.0
      distillation_topk: 100
      distillation_add_tail: True
      max_reprompt_len: 22528
      reprompt_truncation: right
      dont_reprompt_on_self_success: True
      remove_thinking_from_demonstration: False
      is_clip: 2.0
      include_environment_feedback: False
      environment_feedback_only_without_solution: False
      reprompt_template: |-
        {prompt}{solution}{feedback}

        Correctly solve the original question.
      solution_template: |-

        Correct solution:

        {successful_previous_attempt}

      feedback_template: |-

        The following is feedback from your unsuccessful earlier attempt:

        {feedback_raw}

    rlsd:
      _target_: recipe.rlsd.rlsd_config.RLSDReweightConfig
      lambda_: 0.5
      clip_range: 0.2
      negative_only: False
      thought_only: False
      lambda_warmup_steps: 0
      lambda_decay_steps: 60
      teacher_sync_interval: 20

    optim:
      lr: 1e-5
      lr_warmup_steps: 10

  ref:
    log_prob_micro_batch_size_per_gpu: 1

  model:
    trust_remote_code: True

  rollout:
    name: vllm
    n: 8
    calculate_log_probs: True
    gpu_memory_utilization: 0.55
    log_prob_micro_batch_size_per_gpu: 1
    tensor_model_parallel_size: 1
    max_num_batched_tokens: 18944
    max_model_len: 18944
    temperature: 1.0
    top_p: 1
    top_k: -1
    val_kwargs:
      top_p: 0.95
      temperature: 0.6
      n: 1
      do_sample: True

algorithm:
  # disables critic
  adv_estimator: grpo
  norm_adv_by_std_in_grpo: True
  use_kl_in_reward: False
  rollout_correction:
    rollout_is: null
    rollout_is_threshold: 2.0

custom_reward_function:
  path: core/utils/reward_score/sdpo_math_feedback_score.py
  name: compute_score

reward_model:
  reward_manager: dapo
  use_reward_loop: False
  reward_kwargs:
    max_resp_len: 8192
    overlong_buffer_cfg:
      enable: False
      len: 0
      penalty_factor: 0.0
      log: False
  api_endpoints:
    - name: "empty"
      endpoint: "xxxx"

trainer:
  project_name: verl-rlsd
  n_gpus_per_node: 8
  nnodes: 1
  save_freq: 10
  test_freq: 10
  max_actor_ckpt_to_keep: null
  total_epochs: 500
  total_training_steps: null
  val_before_train: False
  logger: ["console", "wandb"]
