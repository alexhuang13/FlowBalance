# Standalone Anti-SDPO trainer config. Existing SDPO config is untouched.

hydra:
  searchpath:
    - file://verl/verl/trainer/config

defaults:
  - ppo_trainer
  - _self_

data:
  train_batch_size: 32
  gen_batch_size: ${data.train_batch_size}
  max_prompt_length: 2048
  max_response_length: 8192
  filter_overlong_prompts: True
  shuffle: True
  trust_remote_code: True
  apply_chat_template_kwargs: { "enable_thinking": true }

actor_rollout_ref:
  actor:
    _target_: recipe.antisd.antisd_config.AntiSDFSDPActorConfig

    ppo_mini_batch_size: 32
    ppo_micro_batch_size_per_gpu: 1
    ppo_max_token_len_per_gpu: 10240
    clip_ratio_high: 0.28
    clip_ratio_low: 0.2
    use_kl_loss: False

    policy_loss:
      # Full Anti-SDPO path: GRPO + token-level AntiSD PRM credit assignment.
      loss_mode: grpo_ca

    self_distillation:
      _target_: recipe.antisd.antisd_config.AntiSDSelfDistillationConfig
      full_logit_distillation: False
      alpha: 0.5
      success_reward_threshold: 0.5
      teacher_regularization: ema
      teacher_update_rate: 1.0
      distillation_topk: null
      distillation_add_tail: True
      max_reprompt_len: 10240
      max_solution_tokens: 3072
      reprompt_truncation: right
      dont_reprompt_on_self_success: True
      remove_thinking_from_demonstration: False
      solution_selection: random
      truncate_solution_at_correct_answer: True
      solution_source: group_only
      solution_content: full
      solution_mode: normal
      include_environment_feedback: True
      provide_ground_truth_in_feedback: False
      environment_feedback_only_without_solution: False
      is_clip: null
      reprompt_template: |-
        {prompt}{solution}{feedback}

        Correctly solve the original question.
      solution_template: |-

        Correct solution:

        {successful_previous_attempt}

      feedback_template: |-

        The following is feedback from your unsuccessful earlier attempt:

        {feedback_raw}
      anti_sd:
        enabled: True
        distillation_sign: -1.0

    ccir:
      _target_: recipe.antisd.antisd_config.AntiSDCCIRConfig
      enabled: False
      ca_mode: additive
      ca_lambda: 0.1
      ca_lambda_mode: teacher_perp
      ca_lambda_tppl_scope: per_seq
      ca_lambda_min: -0.02
      ca_lambda_max: 0.5
      ca_lambda_perp_target: 0.0
      ca_lambda_perp_target_ratio: 0.0
      ca_lambda_perp_reactivate_target: 0.0
      ca_lambda_perp_reactivate_ratio: 0.0
      ca_lambda_perp_delta: 0.10
      ca_lambda_perp_alpha: 2.0
      ca_lambda_perp_mask: 3.0
      ca_lambda_warmup_steps: 5
      ca_lambda_mean_shift: False
      ca_lambda_mean_shift_always: False
      orm_weight: 1.0
      prm_weight: 0.0
      prm_normalize: True
      prm_normalize_mode: sequence
      prm_entropy_neutral: none
      prm_anchor_to_orm: False
      prm_seq_demean: False
      prm_clip: 3.0
      prm_construction: reverse
      prm_gamma: 1.0
      prm_forward_mode: jsd_unbiased
      prm_renyi_sign: -1.0
      prm_renyi_virtual_alpha: 1.0
      prm_forward_log_clip: 5.0
      prm_u_clip_mode: adaptive
      prm_u_clip_k_sigma: 2.0
      prm_u_clip_sigma_ref_fixed: 0.0
      prm_length_mask_threshold: 12000
      si_mode: none
      si_reference: bare
      maxent_coeff: none
      maxent_alpha: 0.0
      ccir_cross_problem: False

    optim:
      lr: 1e-6
      lr_warmup_steps: 0

  ref:
    log_prob_micro_batch_size_per_gpu: 1

  model:
    trust_remote_code: True

  rollout:
    name: vllm
    n: 8
    calculate_log_probs: True
    gpu_memory_utilization: 0.55
    log_prob_micro_batch_size_per_gpu: 1
    tensor_model_parallel_size: 1
    max_num_batched_tokens: 10240
    max_model_len: 10240
    temperature: 1.0
    top_p: 1
    top_k: -1
    val_kwargs:
      top_p: 0.95
      temperature: 0.6
      n: 1
      do_sample: True

algorithm:
  adv_estimator: grpo
  norm_adv_by_std_in_grpo: False
  use_kl_in_reward: False
  rollout_correction:
    rollout_is: token
    rollout_is_threshold: 2.0

custom_reward_function:
  path: core/utils/reward_score/sdpo_math_feedback_score.py
  name: compute_score

reward_model:
  reward_manager: dapo
  use_reward_loop: False
  overlong_buffer:
    enable: False
    len: 0
    penalty_factor: 0.0
    log: False
  api_endpoints:
    - name: "empty"
      endpoint: "xxxx"

trainer:
  project_name: verl-antisd
  n_gpus_per_node: 8
  nnodes: 1
  save_freq: 10
  test_freq: 10
  max_actor_ckpt_to_keep: null
  total_epochs: 500
  total_training_steps: null
  val_before_train: False
  logger: ["console", "wandb"]
