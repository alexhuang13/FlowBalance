  CXX: /apdcephfs_gy4/share_303378103/user/audenhuang/FlowSD/recipe/sdpo/toolchain/g++
  TRITON_CC: /apdcephfs_gy4/share_303378103/user/audenhuang/FlowSD/recipe/sdpo/toolchain/gcc
  CUDAHOSTCXX: /apdcephfs_gy4/share_303378103/user/audenhuang/FlowSD/recipe/sdpo/toolchain/g++
